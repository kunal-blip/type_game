<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Speed Typing</title>
</head>

<body>
    <div class="main-content">
        <div class="timer" id="timer"></div>
        <div class="container">
            <div class="controls-top">
                <h1>Speed Typing Game</h1>
                <button id="restartBtn" class="btn-restart">Restart</button>
            </div>
            <div class="quote-display" id="quoteDisplay"></div>
            <textarea id="quoteInput" class="quoteInput" autofocus></textarea>
            <div class="controls-bottom">
                <button id="pauseBtn" class="btn-control">Pause</button>
                <div id="speed" class="speed-display">Speed: 0 chars/sec | 0 WPM</div>
                <button id="logoutBtn" class="btn-control btn-logout">Logout</button>
            </div>
        </div>
    </div>

    <div class="history-sidebar">
        <h3>📊 Previous Rounds</h3>
        <div id="roundHistory" class="round-history">
            <p class="no-history">No rounds yet. Start typing!</p>
        </div>
    </div>
</body>

</html>
